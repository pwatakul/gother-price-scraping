[package]
name = "hotel-price-scraper"
version = "0.1.0"
edition = "2021"
authors = ["Gother Challenge Team"]
description = "Hotel price comparison tool - scrapes prices from multiple OTAs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# RabbitMQ
lapin = "2.3"

# HTTP Client (for SerpAPI, Gother API)
reqwest = { version = "0.12", features = ["json"] }

# Excel handling
calamine = "0.24"  # Reading Excel
csv = "1"          # Reading CSV imports (the real hotel list ships as CSV)
rust_xlsxwriter = "0.64"  # Writing Excel

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment & Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Random (for mock data)
rand = "0.8"

# Cron expression parsing (scheduled scraping)
cron = "0.12"

# Authentication (REQ-009) — Argon2id password hashing + signed session JWTs
argon2 = "0.5"
jsonwebtoken = "9"
axum-extra = { version = "0.9", features = ["cookie"] }
time = "0.3"  # cookie Max-Age (the type axum-extra's cookie builder takes)

[dev-dependencies]
# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
