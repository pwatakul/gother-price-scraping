# Builds the two application images on Cloud Build and pushes them to
# Artifact Registry.
#
# Why not build locally: the development Mac is arm64 and the VM is amd64, so
# locally built images would not run there, and cross-building Rust under
# emulation is very slow. Cloud Build runs natively on amd64.
#
# Note the two Dockerfiles expect DIFFERENT build contexts:
#   - backend  builds from ./backend  (Cargo.toml and src/ at the context root)
#   - frontend builds from .          (needs both frontend/ and docker/nginx.conf)
# Getting these the wrong way round fails with confusing "file not found" errors.

substitutions:
  _REGION: asia-southeast1
  _REPO: app

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.backend
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - ./backend

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.frontend
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest

options:
  # The Rust release build with LTO is the slow half; a bigger machine keeps
  # the whole build inside the free tier's daily minutes.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
